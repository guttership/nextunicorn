<svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sheep head (cute) -->
  <!-- Horns -->
  <path d="M 30 35 Q 20 25 15 30" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 70 35 Q 80 25 85 30" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="50" cy="40" r="18" fill="currentColor"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="35" r="3" fill="white"/>
  <circle cx="58" cy="35" r="3" fill="white"/>
  
  <!-- Nose -->
  <circle cx="50" cy="45" r="2" fill="white"/>
  
  <!-- Wool body (fluffy) -->
  <ellipse cx="50" cy="70" rx="20" ry="22" fill="currentColor"/>
  
  <!-- Wool puffs on sides -->
  <circle cx="28" cy="65" r="8" fill="currentColor"/>
  <circle cx="72" cy="65" r="8" fill="currentColor"/>
  
  <!-- Legs -->
  <rect x="40" y="88" width="4" height="10" rx="2" fill="currentColor"/>
  <rect x="56" y="88" width="4" height="10" rx="2" fill="currentColor"/>
</svg>
