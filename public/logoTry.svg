<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .logo-bg { fill: #1a1a2e; }
      .logo-accent { fill: #ff006e; }
      .logo-text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" class="logo-bg" stroke="#ff006e" stroke-width="2"/>
  
  <!-- T shape -->
  <rect x="35" y="20" width="30" height="8" class="logo-accent" rx="2"/>
  <rect x="45" y="28" width="10" height="35" class="logo-accent" rx="2"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="70" r="4" class="logo-accent"/>
  <circle cx="70" cy="70" r="4" class="logo-accent"/>
  
  <!-- Text -->
  <text x="50" y="88" text-anchor="middle" class="logo-text">TRY</text>
</svg>
